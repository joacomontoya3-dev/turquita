<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navbar — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root { --font-inter: "Inter"; }
/* ============================================================================
   MateCoast — design tokens
   Fuente única de verdad para tipografía, spacing y color.
   No hardcodear valores por sección: consumir siempre estas variables.
   ========================================================================== */

:root {
  /* ---- Tipografía ------------------------------------------------------- */
  --font-sans: var(--font-inter), "Inter", -apple-system, BlinkMacSystemFont,
               "Segoe UI", Helvetica, Arial, sans-serif;

  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;

  /* Escala del sitio — tamaño / interlineado */
  --fs-h1: 60px;      --lh-h1: 66px;
  --fs-h2: 40px;      --lh-h2: 48px;
  --fs-h3: 28px;      --lh-h3: 36px;
  --fs-h4: 22px;      --lh-h4: 30px;
  --fs-body-lg: 18px; --lh-body-lg: 28px;
  --fs-body: 16px;    --lh-body: 24px;
  --fs-small: 14px;   --lh-small: 20px;
  --fs-nav: 15px;     --lh-nav: 22px;
  --fs-button: 15px;  --lh-button: normal;

  --ls-nav: 0.3px;    /* rango de la spec: +0.2 a +0.4px */

  /* ---- Spacing ---------------------------------------------------------- */
  --space-1: 8px;
  --space-2: 16px;
  --space-3: 20px;
  --space-4: 24px;
  --space-6: 48px;

  --page-margin: 64px;    /* margen lateral de todas las secciones */
  --section-gap: 96px;    /* separación entre secciones grandes (rango 80–120) */
  --container-max: 1280px;

  /* ---- Navbar ----------------------------------------------------------- */
  --nav-py: var(--space-3);        /* 20px */
  --nav-px: var(--page-margin);    /* 64px */
  --nav-gap-links: 40px;           /* rango de la spec: 36–40 */
  --nav-gap-actions: var(--space-3);
  --nav-gap-icon: var(--space-1);
  --nav-link-py: var(--space-1);
  --nav-icon-size: 20px;           /* rango de la spec: 18–20 */
  --nav-icon-stroke: 1.5;
  --nav-logo-height: 42px;         /* rango de la spec: 40–44 */

  /* ---- Color — costero y claro, no cuero oscuro ------------------------- */
  --color-bg: #ffffff;
  --color-surface: #f1f1f0;
  --color-ink: #111110;
  --color-ink-muted: #6b6b68;
  --color-line: #e3e3e1;
  --color-brand: #546742;   /* verde del logotipo */
}

/* ---- Reset mínimo ------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-ink);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
svg { display: block; }

/* Un solo lugar define el grosor de trazo de todos los íconos */
svg[data-icon] { stroke-width: var(--nav-icon-stroke); }

:focus-visible { outline: 2px solid var(--color-brand); outline-offset: 3px; }

/* ---- Utilidades de escala ---------------------------------------------- */
.h1 { font-size: var(--fs-h1); line-height: var(--lh-h1); font-weight: var(--fw-bold); }
.h2 { font-size: var(--fs-h2); line-height: var(--lh-h2); font-weight: var(--fw-semibold); }
.h3 { font-size: var(--fs-h3); line-height: var(--lh-h3); font-weight: var(--fw-semibold); }
.h4 { font-size: var(--fs-h4); line-height: var(--lh-h4); font-weight: var(--fw-medium); }
.bodyLg { font-size: var(--fs-body-lg); line-height: var(--lh-body-lg); }
.small { font-size: var(--fs-small); line-height: var(--lh-small); }

.container {
  max-width: var(--container-max);
  margin-inline: auto;
  padding-inline: var(--page-margin);
}

.srOnly {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ============================================================================
   Navbar — desktop. Todos los valores salen de los tokens de globals.css
   ========================================================================== */

.header {
  width: 100%;
  background: var(--color-bg);
  border-bottom: 1px solid var(--color-line);
}

/* Tres bloques. Los tracks laterales son 1fr iguales, así que el centro cae
   en el centro del CONTENEDOR y no en el centro del espacio libre — que es
   lo que pasaría con flex + space-between, porque los bloques miden distinto. */
.nav {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: var(--space-4);

  max-width: var(--container-max);
  margin-inline: auto;
  padding: var(--nav-py) var(--nav-px);
}

/* ---- Bloque izquierdo --------------------------------------------------- */
.links {
  display: flex;
  align-items: center;
  gap: var(--nav-gap-links);
  justify-self: start;
  min-width: 0;
}

.link {
  display: inline-block;
  width: max-content;              /* hug content */
  padding: var(--nav-link-py) 0;   /* 8px vertical / 0 horizontal */
  font-size: var(--fs-nav);
  line-height: var(--lh-nav);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-nav);
  color: var(--color-ink);
  white-space: nowrap;
  transition: color 120ms ease;
}

.link:hover { color: var(--color-ink-muted); }

.link[aria-current="page"] {
  box-shadow: 0 1px 0 currentColor;   /* subrayado sin reservar alto */
}

/* ---- Centro ------------------------------------------------------------- */
.logo {
  justify-self: center;
  display: inline-flex;
  align-items: center;
}

.logo svg {
  height: var(--nav-logo-height);
  width: auto;
  color: var(--color-brand);
}

/* ---- Bloque derecho ----------------------------------------------------- */
.actions {
  display: flex;
  align-items: center;
  gap: var(--nav-gap-actions);
  justify-self: end;
}

/* Texto + ícono en línea. No es un botón: sin fondo, sin borde, sin radio. */
.action {
  display: inline-flex;
  align-items: center;
  gap: var(--nav-gap-icon);
  padding: var(--nav-link-py) 0;
  font-size: var(--fs-nav);
  line-height: var(--lh-nav);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-nav);
  color: var(--color-ink);
  white-space: nowrap;
  transition: color 120ms ease;
}

.action:hover { color: var(--color-ink-muted); }

.action svg {
  width: var(--nav-icon-size);
  height: var(--nav-icon-size);
  flex: none;
}

.count { font-variant-numeric: tabular-nums; }

body { background: var(--color-bg); }
.ruler { height: 320px; background:
  linear-gradient(to right, color-mix(in srgb, var(--color-brand) 8%, transparent) 0 1px, transparent 1px) 0 0 / 8px 100%; }
</style></head>
