  <text x="48" y="88" font-size="21" font-weight="600" fill="#0b0b0b">Cada activo indexado a base 100 en el primer mes</text>
  <text x="48" y="112" font-size="12.5" font-weight="400" fill="#52514e">Todo arranca en 100, así que las líneas comparan rentabilidad y no tamaño de</text>
  <text x="48" y="129" font-size="12.5" font-weight="400" fill="#52514e">posición. Un mismo eje para todo: sin segundo eje y sin que la posición más grande</text>
  <text x="48" y="146" font-size="12.5" font-weight="400" fill="#52514e">tape a las demás.</text>
  <text x="48" y="182" font-size="11" font-weight="400" fill="#898781">Mejor activo</text><text x="48" y="210" font-size="22" font-weight="600" fill="#0b0b0b">Tecnología</text><text x="48" y="230" font-size="12" font-weight="400" fill="#006300">+115 % en 3 años</text>
  <text x="200" y="182" font-size="11" font-weight="400" fill="#898781">Peor activo</text><text x="200" y="210" font-size="22" font-weight="600" fill="#0b0b0b">Renta fija</text><text x="200" y="230" font-size="12" font-weight="400" fill="#52514e">+6 % en 3 años</text>
  <text x="340" y="182" font-size="11" font-weight="400" fill="#898781">Cartera vs. índice</text><text x="340" y="210" font-size="22" font-weight="600" fill="#006300">+13 pts</text><text x="340" y="230" font-size="12" font-weight="400" fill="#52514e">sobre el índice, en base 100</text>
